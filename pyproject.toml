[project]
name = "gost-docx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitry Klimov", email = "dmitry.v.klimov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# split_after="auto": подбор точек разрыва по вёрстке реального Word.
autosplit = ["pywin32>=306; sys_platform == 'win32'"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gost"
